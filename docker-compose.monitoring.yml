# =====================================================================
#  BUOC 4 (commit 2): Giam sat bang Prometheus + Grafana + Alertmanager
#  Exporter: cAdvisor (container), node-exporter (may chu),
#            nginx-exporter (web server), mysqld-exporter (database)
# =====================================================================
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # Gan them mang monitoring de Prometheus scrape duoc
  webapp:
    networks: [frontend, backend, monitoring]
  nginx:
    networks: [frontend, monitoring]

  prometheus:
    <<: *hardening
    image: prom/prometheus:v2.55.1
    container_name: tintuc-prometheus
    user: "65534:65534"            # nobody
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.external-url=/prometheus/
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    networks: [frontend, monitoring]

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.27.0
    container_name: tintuc-alertmanager
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://${SERVER_IP}/alertmanager/
      - --cluster.listen-address=        # chay 1 ban, tat che do cum
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [frontend, monitoring]

  grafana:
    <<: *hardening
    image: grafana/grafana:11.3.1
    container_name: tintuc-grafana
    user: "472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus, alertmanager]
    networks: [frontend, monitoring]

  cadvisor:
    <<: *hardening
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: tintuc-cadvisor
    privileged: true               # cAdvisor can doc cgroup cua host (ngoai le, chi nam trong mang monitoring)
    devices: [/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]

  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.8.2
    container_name: tintuc-node-exporter
    user: "65534:65534"
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks: [monitoring]

  nginx-exporter:
    <<: *hardening
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: tintuc-nginx-exporter
    user: "65534:65534"
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on: [nginx]
    networks: [monitoring]

  mysqld-exporter:
    <<: *hardening
    image: prom/mysqld-exporter:v0.16.0
    container_name: tintuc-mysqld-exporter
    user: "65534:65534"
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_DB_PASSWORD}
    depends_on:
      mysql: { condition: service_healthy }
    networks: [backend, monitoring]

networks:
  monitoring:
    internal: true                 # mang giam sat noi bo

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
