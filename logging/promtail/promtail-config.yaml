server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Tu dong phat hien moi container cua project "tintuc" qua Docker API
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=tintuc"]
    relabel_configs:
      # job = ten service trong docker-compose (webapp, nginx, mysql, ...)
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: job
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      # Webapp ghi log JSON: gan nhan level va event (LOGIN_FAILED, SUSPICIOUS_INPUT...)
      - match:
          selector: '{job="webapp"}'
          stages:
            - json:
                expressions:
                  level: level
                  event: event
            - labels:
                level:
                event:
      # Nginx access log JSON: gan nhan status (200, 404, 429, 500...)
      - match:
          selector: '{job="nginx"}'
          stages:
            - json:
                expressions:
                  status: status
            - labels:
                status:
