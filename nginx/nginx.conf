# Nginx chay bang user khong phai root (image nginx-unprivileged, uid 101)
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Thu muc tam dat trong /tmp de container chay duoc voi read_only filesystem
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Access log dang JSON -> Loki/LogQL loc theo truong (status, uri, ...)
    log_format json_log escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream":"$upstream_addr",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /dev/stdout json_log;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;              # HARDENING: an phien ban Nginx
    client_max_body_size 5m;

    # Gioi han toc do request (chong spam / brute-force co ban)
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_status 429;           # tra ve 429 Too Many Requests khi vuot nguong

    include /etc/nginx/conf.d/*.conf;
}
