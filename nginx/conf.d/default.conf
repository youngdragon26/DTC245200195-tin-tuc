# ---------- Chuyen huong HTTP -> HTTPS ----------
server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------- HTTPS (chung chi tu ky) ----------
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # ---- Security headers ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Website tin tuc
    location / {
        limit_req zone=req_limit burst=40 nodelay;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        proxy_pass http://webapp:3000;
    }

    # Chong do mat khau trang dang nhap quan tri
    location = /admin/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://webapp:3000;
    }

    # Khong cho nguoi ngoai xem metrics noi bo cua app
    location = /metrics { deny all; }

    # Cong cu quan ly DB: them lop Basic Auth truoc trang dang nhap MySQL
    location /phpmyadmin/ {
        auth_basic "phpMyAdmin - khu vuc quan tri";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;
        proxy_pass http://phpmyadmin:80/;
    }

    # ---- Proxy toi Grafana / Prometheus (Buoc 4) ----
    include /etc/nginx/conf.d/*.locations;   # khong co file nao thi Nginx bo qua
}

# ---------- Trang trang thai Nginx (chi cho nginx-exporter trong mang noi bo) ----------
server {
    listen 8081;
    server_name _;
    access_log off;
    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
    }
}
