# =====================================================================
#  De 19 - Website Tin tuc / Cong thong tin
#  BUOC 1-3: Ung dung web + MySQL + phpMyAdmin + Nginx reverse proxy
# =====================================================================
name: tintuc

# Thiet lap bao mat dung chung cho cac container (HARDENING)
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true      # khong cho leo thang dac quyen
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # ---------------- Ung dung web ----------------
  webapp:
    <<: *hardening
    build: ./app
    image: tintuc-webapp:1.0
    container_name: tintuc-webapp
    user: "1000:1000"              # non-root
    read_only: true                # filesystem chi doc
    tmpfs: [/tmp]
    cap_drop: [ALL]
    environment:
      DB_HOST: mysql
      DB_NAME: tintuc
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      mysql: { condition: service_healthy }
    networks: [frontend, backend]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  # ---------------- Co so du lieu ----------------
  mysql:
    <<: *hardening
    image: mysql:8.4
    container_name: tintuc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [backend]            # KHONG mo cong ra ngoai, chi mang noi bo
    deploy:
      resources:
        limits: { memory: 768M }

  # ---------------- Cong cu quan ly DB ----------------
  phpmyadmin:
    <<: *hardening
    image: phpmyadmin:5.2
    container_name: tintuc-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_ABSOLUTE_URI: https://${SERVER_IP}/phpmyadmin/
      UPLOAD_LIMIT: 5M
    depends_on: [mysql]
    networks: [frontend, backend]

  # ---------------- Reverse proxy ----------------
  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.27-alpine   # chay bang user nginx (uid 101)
    container_name: tintuc-nginx
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    ports:
      - "80:8080"                  # chi Nginx duoc mo cong ra ngoai
      - "443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/auth:/etc/nginx/auth:ro
    depends_on: [webapp, phpmyadmin]
    networks: [frontend]

networks:
  frontend:                        # mang cho Nginx <-> cac dich vu web
  backend:
    internal: true                 # NETWORK ISOLATION: mang DB khong ra duoc Internet

volumes:
  mysql_data:
