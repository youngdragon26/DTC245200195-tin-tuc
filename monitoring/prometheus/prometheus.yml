global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Gui canh bao sang Alertmanager
alerting:
  alertmanagers:
    - path_prefix: /alertmanager
      static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # Prometheus tu giam sat chinh no
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]

  # Ung dung web Tin tuc (prom-client)
  - job_name: webapp
    static_configs:
      - targets: ["webapp:3000"]

  # Web server Nginx (qua nginx-prometheus-exporter)
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Database MySQL (qua mysqld-exporter)
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # Tai nguyen tung container (CPU, RAM, mang)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Tai nguyen may chu Linux
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Alertmanager
  - job_name: alertmanager
    metrics_path: /alertmanager/metrics
    static_configs:
      - targets: ["alertmanager:9093"]
